version: '2'
image_name: llamastack-vllm-remote llamastack
container_image: null
apis:
- inference
- safety
- agents
- vector_io
- datasetio
- scoring
- eval
- post_training
- tool_runtime
- telemetry
- files
providers:
  inference:
  - provider_id: vllm
    provider_type: remote::vllm
    config:
      url: ${env.VLLM_URL}/v1
      max_tokens: ${env.VLLM_MAX_TOKENS:4096}
      api_token: ${env.VLLM_API_TOKEN:fake}
      tls_verify: ${env.VLLM_TLS_VERIFY:true}
  - provider_id: vllm-mass
    provider_type: remote::vllm
    config:
      url: https://litellm-litemaas.apps.prod.rhoai.rh-aiservices-bu.com/v1
      max_tokens: ${env.VLLM_MAX_TOKENS:4096}
      api_token: "sk-hwkf7LXC93MWFbh1bk-kYA"
      tls_verify: ${env.VLLM_TLS_VERIFY:true}
  safety:
  - provider_id: llama-guard
    provider_type: inline::llama-guard
    config:
      excluded_categories: []
  agents:
  - provider_id: meta-reference
    provider_type: inline::meta-reference
    config:
      persistence_store:
        type: sqlite
        namespace: null
        db_path: ${env.SQLITE_STORE_DIR:~/.llama/distributions/llamastack-vllm-remote
          llamastack}/agents_store.db
      responses_store:
        type: sqlite
        db_path: ${env.SQLITE_STORE_DIR:~/.llama/distributions/llamastack-vllm-remote
          llamastack}/responses_store.db
  vector_io:
  - provider_id: faiss
    provider_type: inline::faiss
    config:
      kvstore:
        type: sqlite
        namespace: null
        db_path: ${env.SQLITE_STORE_DIR:~/.llama/distributions/llamastack-vllm-remote
          llamastack}/faiss_store.db
  datasetio:
  - provider_id: localfs
    provider_type: inline::localfs
    config:
      kvstore:
        type: sqlite
        namespace: null
        db_path: ${env.SQLITE_STORE_DIR:~/.llama/distributions/llamastack-vllm-remote
          llamastack}/localfs_datasetio.db
  scoring:
  - provider_id: basic
    provider_type: inline::basic
    config: {}
  eval:
  - provider_id: meta-reference
    provider_type: inline::meta-reference
    config:
      kvstore:
        type: sqlite
        namespace: null
        db_path: ${env.SQLITE_STORE_DIR:~/.llama/distributions/llamastack-vllm-remote
          llamastack}/meta_reference_eval.db
  post_training:
  - provider_id: torchtune
    provider_type: inline::torchtune
    config:
      checkpoint_format: meta
  tool_runtime:
  - provider_id: tavily-search
    provider_type: remote::tavily-search
    config:
      api_key: ${env.TAVILY_SEARCH_API_KEY:}
      max_results: 3
  telemetry:
  - provider_id: meta-reference
    provider_type: inline::meta-reference
    config:
      service_name: "${env.OTEL_SERVICE_NAME:\u200B}"
      sinks: ${env.TELEMETRY_SINKS:console,sqlite}
      sqlite_db_path: ${env.SQLITE_STORE_DIR:~/.llama/distributions/llamastack-vllm-remote
        llamastack}/trace_store.db
  files:
  - provider_id: localfs
    provider_type: inline::localfs
    config:
      storage_dir: ${env.FILES_STORAGE_DIR:~/.llama/distributions/llamastack-vllm-remote
        llamastack/files}
      metadata_store:
        type: sqlite
        db_path: ${env.SQLITE_STORE_DIR:~/.llama/distributions/llamastack-vllm-remote
          llamastack}/files_metadata.db
metadata_store: null
inference_store: null
models:
- metadata: {}
  model_id: granite-3.3-2b-instruct
  provider_id: vllm
  provider_model_id: ibm-granite/granite-3.3-2b-instruct
  model_type: llm
shields: []
vector_dbs: []
datasets: []
scoring_fns: []
benchmarks: []
tool_groups: []
logging: null
server:
  port: 8321
  tls_certfile: null
  tls_keyfile: null
  tls_cafile: null
  auth: null
  host: null
  quota: null
external_providers_dir: /root/.llama/providers.d
                                                  
